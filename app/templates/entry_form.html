{% extends "base.html" %}

{% block title %}{{ heading }}{% endblock %}

{% block content %}

<div class="container">
    <div class="row">
        <div class="col-md-12">
            <h2>{{ heading }}</h2>
            <div class="card">
                <div class="card-body">
                    <form action="{{ form_action }}" method="post">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                        <div class="form-group">
                            <label for="title">Title</label>
                            <input class="form-control{{ ' is-invalid' if errors.get('title') }}" type="text"
                                   id="title" name="title" placeholder="Title" value="{{ values.get('title', '') }}">
                            {% if errors.get('title') %}
                            <div class="invalid-feedback" id="title-error">{{ errors['title'] }}</div>
                            {% endif %}
                        </div>
                        <div class="form-group">
                            <label for="description">Description</label>
                            <textarea class="form-control{{ ' is-invalid' if errors.get('description') }}"
                                      id="description" name="description" rows="3"
                                      placeholder="Add a Description">{{ values.get('description', '') }}</textarea>
                            {% if errors.get('description') %}
                            <div class="invalid-feedback" id="description-error">{{ errors['description'] }}</div>
                            {% endif %}
                        </div>
                        <button class="btn btn-primary" type="submit">{{ submit_label }}</button>
                        <a class="btn btn-secondary" href="{{ url_for('index') }}">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
