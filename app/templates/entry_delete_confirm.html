{% extends "base.html" %}

{% block title %}Delete entry{% endblock %}

{% block content %}

<div class="container">
    <h2>Delete entry</h2>
    <div class="card">
        <div class="card-body">
            <p>Are you sure you want to delete this entry? This cannot be undone.</p>
            <dl>
                <dt>Title</dt>
                <dd id="delete-title">{{ entry.title }}</dd>
                <dt>Description</dt>
                <dd>{{ entry.description }}</dd>
            </dl>
            <form action="{{ url_for('delete_entry', id=entry.id) }}" method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <button class="btn btn-danger" type="submit">Delete</button>
                <a class="btn btn-secondary" href="{{ url_for('index') }}">Cancel</a>
            </form>
        </div>
    </div>
</div>

{% endblock %}
